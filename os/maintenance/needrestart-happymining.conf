# HappyMining OS — needrestart policy for a GPU host.
# Installed as /etc/needrestart/conf.d/50-happymining.conf
#
# After a library upgrade, needrestart can restart the services that still use
# the old library. On a GPU host that could restart the Docker daemon or the
# Vast host daemon while customer instances are running. List what needs a
# restart, never do it automatically ('l' = list only). Vast's own upgrade
# guide runs apt with NEEDRESTART_MODE=l for the same reason.
$nrconf{restart} = 'l';

# Do not ask about, or act on, a pending kernel upgrade either.
$nrconf{kernelhints} = 0;
