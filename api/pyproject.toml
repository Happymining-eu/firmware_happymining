[project]
name = "happymining"
version = "0.1.0"
description = "HappyMining OS control plane: fleet API, earnings ledger and owner settlements"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "pyotp>=2.9,<3",
    "cryptography>=43",
    "httpx>=0.27,<1",
    "prometheus-client>=0.20,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "pyyaml>=6",
    "jsonschema>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["happymining"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["../migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the documented idiom
    "S101",   # asserts are used in tests and for internal invariants
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"../tests/**" = ["S105", "S106", "S107", "S311", "S603", "S607", "S608", "B017", "RUF059", "S110", "C408", "SIM102"]
"../scripts/**" = ["S603", "S607"]
# The Mole Hash client is one file meant to be copied into another code base
# that may run an older Python: it keeps typing.Optional / Dict on purpose.
"../integrations/**" = ["UP006", "UP035", "UP045", "UP028"]
"happymining/demo/**" = ["S105", "S106", "S311"]
