# HappyMining OS control plane on a host that already runs Traefik.
#
# Written for the Hostinger VPS, where Traefik owns ports 80 and 443 and other
# projects reach it over the external Docker network "proxy". This stack
# publishes no port of its own and has no Caddy: Traefik terminates TLS and
# routes to the API by container label.
#
# The Hostinger Docker manager deploys a compose file plus an environment
# block. It pulls images and starts containers; it never builds one, and there
# is no checkout of this repository on the server. So this file uses stock
# images only. A one-shot "bootstrap" container fetches the commit named by
# HM_GIT_REF from GitHub and installs the hash-pinned dependencies into a
# volume (deploy/hostinger/bootstrap.py); the migration job, the API and the
# worker then run from that volume, read-only, as an unprivileged user.
# A redeploy with a new HM_GIT_REF prepares the new version next to the old one
# and removes the old one when the new one is complete.
#
# Every value comes from the project's environment (see .env.example next to
# this file). Nothing secret is written here.
#
# Routing, highest priority first:
#   1. the two sign-in endpoints of the JSON API   -> basic auth (staging gate)
#   2. the rest of /api/v1, /healthz and /static   -> the application's own auth
#   3. every page                                  -> basic auth (staging gate)
# HM_GATE_MIDDLEWARES decides whether 1 and 3 are gated. The default gates
# them, and the default basic-auth entry is an account nobody can sign in to,
# so a deployment that forgets to configure the gate is closed, not open.

name: happymining-os

x-app: &app
  image: python:3.13-slim-bookworm
  restart: unless-stopped
  user: "10001:10001"
  working_dir: /opt/hm/${HM_GIT_REF:?set HM_GIT_REF to the commit to deploy}
  volumes:
    - app:/opt/hm:ro
  environment: &app-env
    PYTHONPATH: /opt/hm/${HM_GIT_REF}/api:/opt/hm/${HM_GIT_REF}/site
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"
    HM_MIGRATIONS_DIR: /opt/hm/${HM_GIT_REF}/migrations
    HM_MODE: ${HM_MODE:?set HM_MODE to demo or live}
    HM_PROVIDER: ${HM_PROVIDER:?set HM_PROVIDER to fake (demo) or vast (live)}
    HM_SECRET_KEY: ${HM_SECRET_KEY:?set HM_SECRET_KEY}
    HM_FIELD_ENCRYPTION_KEY: ${HM_FIELD_ENCRYPTION_KEY:?set HM_FIELD_ENCRYPTION_KEY}
    # Unprivileged runtime role. Only the migration job uses the owner role.
    HM_DATABASE_URL: postgresql+psycopg://happymining_app:${HM_DB_APP_PASSWORD:?set HM_DB_APP_PASSWORD}@db:5432/happymining
    HM_PUBLIC_BASE_URL: https://${HM_PUBLIC_HOST:?set HM_PUBLIC_HOST}
    HM_ALLOWED_HOSTS: ${HM_PUBLIC_HOST},${HM_API_HOST:-${HM_PUBLIC_HOST}}
    HM_COOKIE_SECURE: "true"
    # Traefik is the only proxy in front. Add one for each further proxy
    # (Cloudflare, a load balancer), or rate limits will see a single client.
    HM_TRUSTED_PROXY_HOPS: "${HM_TRUSTED_PROXY_HOPS:-1}"
    HM_DEMO_LOGIN_ENABLED: "${HM_DEMO_LOGIN_ENABLED:-false}"
    HM_PAYOUTS_ENABLED: "${HM_PAYOUTS_ENABLED:-false}"
    HM_PAYOUT_PROVIDER: ${HM_PAYOUT_PROVIDER:-manual_export}
    HM_PROVIDER_MUTATIONS_ENABLED: "${HM_PROVIDER_MUTATIONS_ENABLED:-false}"
    HM_DISRUPTIVE_OPERATIONS_ENABLED: "${HM_DISRUPTIVE_OPERATIONS_ENABLED:-false}"
    HM_VAST_API_KEY: ${HM_VAST_API_KEY:-}
    HM_VAST_COMMERCIAL_AUTHORIZATION_REF: ${HM_VAST_COMMERCIAL_AUTHORIZATION_REF:-}
    HM_VAST_EARNINGS_BASIS: ${HM_VAST_EARNINGS_BASIS:-unverified}
    HM_VAST_EARNINGS_BUCKETS_VERIFIED: "${HM_VAST_EARNINGS_BUCKETS_VERIFIED:-false}"
    HM_METRICS_TOKEN: ${HM_METRICS_TOKEN:-}
    HM_LOG_LEVEL: ${HM_LOG_LEVEL:-INFO}
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  mem_limit: 512m
  cpus: 1.0
  networks:
    - backend

services:
  # Prepares /opt/hm/<commit>: the source of that commit and its dependencies.
  # Runs as root inside the container only to write into the volume, with no
  # capabilities; everything else reads the volume as an unprivileged user.
  bootstrap:
    image: python:3.13-slim-bookworm
    restart: "no"
    volumes:
      - app:/opt/hm
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    environment:
      HM_GIT_REPO: ${HM_GIT_REPO:-Happymining-eu/firmware_happymining}
      HM_GIT_REF: ${HM_GIT_REF}
    # The script comes from the same commit it is about to fetch.
    command:
      - python
      - -c
      - >-
        import os, urllib.request as u;
        repo, ref = os.environ["HM_GIT_REPO"], os.environ["HM_GIT_REF"];
        src = u.urlopen(f"https://raw.githubusercontent.com/{repo}/{ref}/deploy/hostinger/bootstrap.py", timeout=60).read();
        ns = {"__name__": "bootstrap"};
        exec(compile(src, "bootstrap.py", "exec"), ns);
        ns["prepare"](repo, ref, __import__("pathlib").Path("/opt/hm"))
    networks:
      - backend

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: happymining
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: happymining
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happymining -d happymining"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    networks:
      - backend

  migrate:
    <<: *app
    restart: "no"
    environment:
      <<: *app-env
      # Owner role: creates the schema, then creates or updates the runtime role.
      HM_DATABASE_URL: postgresql+psycopg://happymining:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/happymining
      HM_DB_APP_PASSWORD: ${HM_DB_APP_PASSWORD:?set HM_DB_APP_PASSWORD}
    # Synthetic demo data is seeded in DEMO mode only (the command refuses LIVE anyway).
    command:
      - sh
      - -c
      - >-
        python -m happymining.cli migrate &&
        python -m happymining.cli setup-runtime-role &&
        if [ "$$HM_MODE" = "demo" ]; then python -m happymining.cli seed-demo; fi
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  api:
    <<: *app
    command:
      - python
      - -m
      - uvicorn
      - happymining.main:app_factory
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-proxy-headers
      - --no-server-header
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    networks:
      - backend
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.services.hmos.loadbalancer.server.port: "8000"

      # 1. Sign-in endpoints of the API: behind the staging gate.
      traefik.http.routers.hmos-signin.rule: (Host(`${HM_PUBLIC_HOST}`) || Host(`${HM_API_HOST:-${HM_PUBLIC_HOST}}`)) && (Path(`/api/v1/auth/demo-login`) || Path(`/api/v1/auth/login`))
      traefik.http.routers.hmos-signin.priority: "300"
      traefik.http.routers.hmos-signin.entrypoints: ${HM_TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.hmos-signin.tls: "true"
      traefik.http.routers.hmos-signin.tls.certresolver: ${HM_TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.hmos-signin.middlewares: ${HM_GATE_MIDDLEWARES:-hmos-limit,hmos-headers,hmos-gate}
      traefik.http.routers.hmos-signin.service: hmos

      # 2. The JSON API, liveness and static files: the application's own
      #    authentication (session token, or a device credential from pairing).
      #    The API cannot share the Authorization header with basic auth.
      traefik.http.routers.hmos-api.rule: (Host(`${HM_PUBLIC_HOST}`) || Host(`${HM_API_HOST:-${HM_PUBLIC_HOST}}`)) && (PathPrefix(`/api/v1/`) || Path(`/healthz`) || PathPrefix(`/static/`))
      traefik.http.routers.hmos-api.priority: "200"
      traefik.http.routers.hmos-api.entrypoints: ${HM_TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.hmos-api.tls: "true"
      traefik.http.routers.hmos-api.tls.certresolver: ${HM_TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.hmos-api.middlewares: hmos-limit,hmos-headers
      traefik.http.routers.hmos-api.service: hmos

      # 3. Everything else: the dashboard pages (and /metrics, which the API
      #    itself answers only with its bearer token).
      traefik.http.routers.hmos-pages.rule: Host(`${HM_PUBLIC_HOST}`) || Host(`${HM_API_HOST:-${HM_PUBLIC_HOST}}`)
      traefik.http.routers.hmos-pages.priority: "100"
      traefik.http.routers.hmos-pages.entrypoints: ${HM_TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.hmos-pages.tls: "true"
      traefik.http.routers.hmos-pages.tls.certresolver: ${HM_TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.hmos-pages.middlewares: ${HM_GATE_MIDDLEWARES:-hmos-limit,hmos-headers,hmos-gate}
      traefik.http.routers.hmos-pages.service: hmos

      # Device heartbeats are capped at 256 KiB by the API; nothing legitimate is larger than this.
      traefik.http.middlewares.hmos-limit.buffering.maxRequestBodyBytes: "1048576"
      traefik.http.middlewares.hmos-headers.headers.customResponseHeaders.X-Robots-Tag: noindex, nofollow
      # htpasswd entries, comma-separated. The default is an account whose
      # password nobody has: the gate stays shut until a real entry is set.
      traefik.http.middlewares.hmos-gate.basicauth.users: ${HM_BASIC_AUTH_USERS:-locked:{SHA}+t2oFd+om50/+UcIqJaJQ9V9nsQ=}
      traefik.http.middlewares.hmos-gate.basicauth.realm: HappyMining OS staging
      traefik.http.middlewares.hmos-gate.basicauth.removeheader: "true"

  worker:
    <<: *app
    command: ["python", "-m", "happymining.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
  app:

networks:
  backend:
  proxy:
    external: true
