# HappyMining privileged helper switches - /etc/happymining/helper.conf
#
# This file must stay owned by root and writable only by root; the helper
# refuses to act otherwise. Everything is disabled by default.
#
# A privileged action runs only if BOTH are true:
#   1. its switch below is 1, and
#   2. its operation type is listed in HM_OPS_ENABLED in agent.env.
#
# Restarting the Vast daemon or rebooting interrupts renter workloads.
# Enabling these is a deliberate decision of this machine's administrator.

# Allow `systemctl restart vastai.service` on request.
ALLOW_RESTART_VAST_DAEMON=0

# Allow a delayed reboot (60 to 3600 seconds, rounded up to minutes) on request.
ALLOW_REBOOT=0
