# HappyMining privileged helper switches - /etc/happymining/helper.conf
#
# This file must stay owned by root and writable only by root; the helper
# refuses to act otherwise. Everything is disabled by default. A value is 0
# (off) or 1 (on); an unknown key disables every switch.
#
# Restarting the Vast daemon or rebooting interrupts renter workloads.
# Enabling these is a deliberate decision of this machine's administrator.
# Each of the two requires BOTH its switch below AND its operation type in
# HM_OPS_ENABLED in agent.env.

# Allow `systemctl restart vastai.service` on request.
ALLOW_RESTART_VAST_DAEMON=0

# Allow a delayed reboot (60 to 3600 seconds, rounded up to minutes) on request.
ALLOW_REBOOT=0

# --- Appliance (docs/appliance.md) ------------------------------------------
# The appliance installer profile turns the first four on; the Vast host
# profile leaves them off. With ALLOW_PLUGINS and ALLOW_NAS both off, desired-
# state documents are validated and stored but nothing is applied, except
# one thing: a plugin HappyMining started earlier, while ALLOW_PLUGINS was
# on, is stopped when the document no longer runs it (in "vast" mode above
# all). Stopping HappyMining's own plugins needs no switch; starting does.

# Start and stop the catalog plugins (Docker Compose projects hm-<id>, from
# /usr/share/happymining/catalog only). Containers, volumes and networks that
# HappyMining did not start are never stopped or removed, plugin data is never
# deleted remotely, and in "vast" mode every plugin is stopped.
ALLOW_PLUGINS=0

# Mount the document's NAS entries under /srv/happymining/nas/<id> (CIFS or
# NFS, always nosuid,nodev,noexec, read-only unless the entry is a backup
# destination) and unmount the ones HappyMining mounted that were removed.
ALLOW_NAS=0

# Run backups: an encrypted archive of the applied document and of the
# plugins' volumes, to a NAS entry mounted read-write or to an S3 bucket. The
# plugins whose volumes are saved are stopped during the backup and started
# again afterwards. The key is created on this machine (happyminingctl backup
# init) and never leaves it.
ALLOW_BACKUP=0

# Install signed firmware releases of the HappyMining agent package: signature
# checked against /usr/share/happymining/release-keys, never a downgrade, the
# installed package kept for an automatic rollback.
ALLOW_UPDATE=0

# Start a plugin even though one of its images is not pinned to a digest read
# from its registry. Leave off unless you accept images that can change.
ALLOW_UNPINNED_IMAGES=0

# Start plugins that use the GPUs while containers HappyMining did not start
# (for example a renter's) are running. Off, such plugins are blocked; this is
# a guard, not a proof that no rental is affected.
ALLOW_FOREIGN_CONTAINERS=0

# Install a release although no copy of the installed package is kept for a
# rollback (/var/lib/happymining-helper/packages/current.deb is missing, as on
# a machine installed without the installer image). A release whose agent does
# not come back then cannot be rolled back automatically.
ALLOW_UPDATE_WITHOUT_ROLLBACK=0
