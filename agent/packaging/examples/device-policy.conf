# Optional hardening for happymining-agent.service: restrict device access
# to the NVIDIA character devices.
#
# NOT enabled by default and NOT verified on real NVIDIA hardware. The device
# allow-list is resolved when the unit starts: if the NVIDIA kernel module is
# loaded later (driver installed after the agent, or loaded on demand), GPU
# telemetry stays empty until `systemctl restart happymining-agent`.
#
# To try it:
#   sudo install -D -m 0644 /usr/share/doc/happymining-agent/examples/device-policy.conf \
#        /etc/systemd/system/happymining-agent.service.d/device-policy.conf
#   sudo systemctl daemon-reload && sudo systemctl restart happymining-agent
#   happyminingctl status      # then check that GPUs are still reported
[Service]
DevicePolicy=closed
DeviceAllow=char-nvidia* rw
