# Alembic configuration. The database URL is read from HM_DATABASE_URL
# (see migrations/env.py); nothing secret is stored here.
[alembic]
script_location = migrations
prepend_sys_path = api
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
